name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Lint (gofmt + vet)
        run: |
          test -z "$(gofmt -l . | grep -v internal/gen)" || (gofmt -l . | grep -v internal/gen; exit 1)
          go vet ./...
      - name: Unit tests (race + coverage)
        run: make cover
      - name: E2E tests
        run: go test -race -count=1 -tags=e2e ./tests/e2e/...
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  python-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: SDK unit tests
        run: python3 sdk/python/tests/test_sdk.py

  proto-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Regenerate and diff (ignoring toolchain version comments)
        run: |
          # Plugin versions are pinned in the Makefile, but the protoc binary
          # differs between the runner and dev machines and only shows up in a
          # header comment. Compare everything except those version lines.
          make proto-tools proto
          if git diff --quiet -- internal/gen/; then
            echo "generated code up to date"
            exit 0
          fi
          # Filter out added/removed lines that only mention tool versions.
          real=$(git diff -U0 -- internal/gen/ \
            | grep -E '^[+-]' \
            | grep -vE '^(\+\+\+|---)' \
            | grep -vE '^[+-]//[[:space:]]*-?[[:space:]]*(protoc|protoc-gen-go|protoc-gen-go-grpc)[[:space:]]' \
            || true)
          if [ -n "$real" ]; then
            echo "generated code out of date; run 'make proto' and commit:"
            echo "$real"
            exit 1
          fi
          echo "only toolchain version comments differ; OK"
