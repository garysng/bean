syntax = "proto3";

package wizard.agent.v1;

import "wizard/common/v1/exec.proto";

option go_package = "github.com/garysng/wizard/internal/gen/wizard/agent/v1;agentv1";

// AgentService: wizardd <-> wizard-agent (vsock on fc tier / unix socket on container tier).
service AgentService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Exec(wizard.common.v1.ExecRequest) returns (wizard.common.v1.ExecResponse);
  rpc StreamExec(stream wizard.common.v1.StreamExecFrame) returns (stream wizard.common.v1.StreamExecFrame);
  rpc ReadFile(wizard.common.v1.ReadFileRequest) returns (stream wizard.common.v1.FileChunk);
  rpc WriteFile(stream wizard.common.v1.WriteFileFrame) returns (wizard.common.v1.WriteFileResponse);
  rpc DeleteFile(wizard.common.v1.DeleteFileRequest) returns (wizard.common.v1.DeleteFileResponse);
  rpc ListDir(wizard.common.v1.ListDirRequest) returns (wizard.common.v1.ListDirResponse);
  rpc GetLogs(wizard.common.v1.GetLogsRequest) returns (stream wizard.common.v1.LogChunk);
  rpc StartUserProcess(StartUserProcessRequest) returns (StartUserProcessResponse);
}

message HealthRequest {}

message HealthResponse {
  string agent_version = 1;
  int64 uptime_seconds = 2;
}

message StartUserProcessRequest {
  // Image config semantics replayed by the agent.
  repeated string entrypoint = 1;
  repeated string cmd = 2;
  map<string, string> env = 3;
  string user = 4;
  string workdir = 5;
}

message StartUserProcessResponse {
  int64 pid = 1;
}
