syntax = "proto3";

package bean.common.v1;

option go_package = "github.com/garysng/bean/internal/gen/bean/common/v1;commonv1";

message ExecRequest {
  string sandbox_id = 1;
  repeated string cmd = 2;
  string cwd = 3;
  map<string, string> env = 4;
  int64 timeout_seconds = 5;
  bytes stdin = 6;
  int64 max_output_bytes = 7;
  string request_id = 8;
}

message ExecResponse {
  int32 exit_code = 1;
  bytes stdout = 2;
  bytes stderr = 3;
  bool truncated = 4;
  int64 duration_ms = 5;
}

message StreamExecFrame {
  oneof frame {
    ExecStart start = 1;
    bytes stdin = 2;
    Resize resize = 3;
    string signal = 4;
    bytes stdout = 5;
    bytes stderr = 6;
    ExecExit exit = 7;
  }
}

message ExecStart {
  string sandbox_id = 1;
  repeated string cmd = 2;
  string cwd = 3;
  map<string, string> env = 4;
  bool pty = 5;
  uint32 cols = 6;
  uint32 rows = 7;
}

message Resize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message ExecExit {
  int32 exit_code = 1;
}

message ReadFileRequest {
  string sandbox_id = 1;
  string path = 2;
}

message FileChunk {
  bytes data = 1;
}

message WriteFileFrame {
  oneof frame {
    WriteFileMeta meta = 1;
    bytes data = 2;
  }
}

message WriteFileMeta {
  string sandbox_id = 1;
  string path = 2;
  uint32 mode = 3;
  bool mkdirs = 4;
}

message WriteFileResponse {
  int64 bytes_written = 1;
}

message DeleteFileRequest {
  string sandbox_id = 1;
  string path = 2;
}

message DeleteFileResponse {}

message ListDirRequest {
  string sandbox_id = 1;
  string path = 2;
}

message ListDirResponse {
  repeated DirEntry entries = 1;
}

message DirEntry {
  string name = 1;
  int64 size = 2;
  uint32 mode = 3;
  int64 mtime_unix = 4;
  bool is_dir = 5;
}

message GetLogsRequest {
  string sandbox_id = 1;
  int32 tail_lines = 2;
  bool follow = 3;
}

message LogChunk {
  bytes data = 1;
}
