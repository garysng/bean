syntax = "proto3";

package bean.node.v1;

import "bean/common/v1/exec.proto";

option go_package = "github.com/garysng/bean/internal/gen/bean/node/v1;nodev1";

// NodeService: beand -> control plane (outbound).
service NodeService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Heartbeat(stream HeartbeatRequest) returns (stream HeartbeatResponse);
  rpc SyncState(SyncStateRequest) returns (SyncStateResponse);
  // UpdateNodeStatus carries what a node *holds and can do*, as opposed to how
  // it is currently doing -- which is Heartbeat's job.
  //
  // The two are separate because they have nothing in common but a destination.
  // A heartbeat renews a lease: small, fixed size, every few seconds. This
  // carries lists whose size grows with the node's caches and which barely
  // change between reports. Carrying them on the heartbeat meant an eval-scale
  // node with thousands of images re-sent, re-serialised and re-wrote an
  // unchanged map every few seconds. The cache in
  // internal/node/image/cached.go exists specifically to blunt the cost of
  // rescanning for that, which is a design smell rather than an optimisation.
  //
  // Sent when something changes, plus a periodic full report so a dropped one
  // cannot leave the control plane permanently stale. Staleness costs affinity
  // accuracy and warm-snapshot hit rate, never correctness: a miss boots, which
  // is what a node without the entry does anyway.
  rpc UpdateNodeStatus(UpdateNodeStatusRequest) returns (UpdateNodeStatusResponse);
}

// SandboxService: implemented by beand; control plane / gateway call it
// directly (push). On NAT'd nodes the calls are multiplexed over the
// node's outbound CommandChannel.
service SandboxService {
  rpc CreateSandbox(CreateSandboxRequest) returns (CreateSandboxResponse);
  rpc DestroySandbox(DestroySandboxRequest) returns (DestroySandboxResponse);
  rpc PauseSandbox(PauseSandboxRequest) returns (PauseSandboxResponse);
  rpc ResumeSandbox(ResumeSandboxRequest) returns (ResumeSandboxResponse);
  rpc GetSandbox(GetSandboxRequest) returns (GetSandboxResponse);
  // SnapshotSandbox streams a checkpoint out of the node. The sandbox is
  // frozen for the duration and returned to its prior state afterwards.
  rpc SnapshotSandbox(SnapshotSandboxRequest) returns (stream SnapshotChunk);
  // RestoreSandbox creates a sandbox from a checkpoint stream. The first
  // frame carries the spec; the rest is checkpoint data. A node that already
  // holds the checkpoint unpacked answers without reading the data frames, so
  // the sender must tolerate the stream being cut short.
  rpc RestoreSandbox(stream RestoreSandboxFrame) returns (RestoreSandboxResponse);
  rpc StartUserProcess(StartUserProcessNodeRequest) returns (StartUserProcessNodeResponse);
  // PrewarmImage makes an image ready on the node without creating a sandbox.
  // A first pull can take minutes — longer than a create should block — so the
  // control plane warms images before placing work that needs them.
  rpc PrewarmImage(PrewarmImageRequest) returns (PrewarmImageResponse);
  // CommitSandbox seals a sandbox's filesystem into a base image. Unlike a
  // snapshot the result carries no memory state and is not bound to the tier
  // that made it, so any sandbox can start from it.
  rpc CommitSandbox(CommitSandboxRequest) returns (CommitSandboxResponse);
  // BuildImage builds a base image from a Dockerfile. The build runs on the
  // node, where BuildKit and the image cache already are.
  //
  // The reply streams BuildKit's progress as it happens and ends with the
  // result. Streaming rather than a unary call buys two things: a build takes
  // minutes and its output is the only way to see which layer is slow or
  // broken, and cancelling the call is what stops the build -- the node runs
  // buildctl under this call's context, so an aborted call kills it.
  rpc BuildImage(BuildImageRequest) returns (stream BuildImageEvent);
  // Data plane passthrough to AgentService.
  rpc Exec(bean.common.v1.ExecRequest) returns (bean.common.v1.ExecResponse);
  rpc StreamExec(stream bean.common.v1.StreamExecFrame) returns (stream bean.common.v1.StreamExecFrame);
  rpc ReadFile(bean.common.v1.ReadFileRequest) returns (stream bean.common.v1.FileChunk);
  rpc WriteFile(stream bean.common.v1.WriteFileFrame) returns (bean.common.v1.WriteFileResponse);
  rpc DeleteFile(bean.common.v1.DeleteFileRequest) returns (bean.common.v1.DeleteFileResponse);
  rpc ListDir(bean.common.v1.ListDirRequest) returns (bean.common.v1.ListDirResponse);
  rpc GetLogs(bean.common.v1.GetLogsRequest) returns (stream bean.common.v1.LogChunk);
}

message RegisterRequest {
  string bootstrap_token = 1;
  string node_id = 2;
  string region = 3;
  map<string, string> labels = 4;
  NodeCapabilities capabilities = 5;
  NodeResources resources = 6;
}

message RegisterResponse {
  string node_token = 1;
  int64 heartbeat_interval_seconds = 2;
}

message NodeCapabilities {
  repeated string runtimes = 1; // e.g. ["fc"], ["fc","runc"]
}

message NodeResources {
  double cpu_allocatable = 1;
  int64 memory_allocatable_mib = 2;
  int64 disk_sandboxes_mib = 3;
  int32 gpu_count = 4;
  // cpu_vendor and cpu_family constrain where a memory snapshot taken on this
  // node can be restored: a guest kernel branches on both for errata handling
  // and MSR access, and no CPU template can hide them. The model is
  // deliberately absent — masking instruction-set features is what makes a
  // snapshot portable across models, so matching on model would defeat it.
  string cpu_vendor = 5;
  int32 cpu_family = 6;
  // cpu_template is the masking policy this node boots guests under ("none" or
  // "portable"). A memory snapshot is only portable across CPU generations if
  // it was taken under a template, so restore has to know which one produced it.
  string cpu_template = 7;
  // max_creates is how many creates this node will have in flight at once. Zero
  // leaves the control plane's default, which is what a node built before this
  // field existed reports.
  //
  // Reported by the node rather than configured centrally because the quantity is
  // a local physical fact: how many guests can boot at once without slowing each
  // other down, which follows from cores, KVM and disk. The control plane's view
  // of a node's CPU has already been multiplied by --overcommit-cpu, so deriving
  // this from it would fold an oversubscription factor into a concurrency limit.
  //
  // It bounds a transient, not a capability: unlike CPU or memory, in-flight
  // creates drain on their own. The scheduler treats exhaustion as a reason to
  // wait rather than to refuse -- see scheduler.worthWaiting -- so this being too
  // low costs latency under burst, not failures, provided --create-wait is set.
  int32 max_creates = 8;
}

message HeartbeatRequest {
  string node_id = 1;
  string node_token = 2;
  repeated SandboxStatus sandboxes = 3;
  NodeUsage usage = 4;
  // cached_images maps image reference to its size on this node. The node is
  // the authority on what it holds, so it reports rather than the control
  // plane inferring; the scheduler uses it for image affinity and prewarm
  // progress.
  // Deprecated: moved to ReportInventory. Still accepted so a node and a control
  // plane of different versions interoperate during a rollout -- a node that
  // stops sending this before the control plane learns to read the new RPC would
  // make every node look like it holds no images, which silently disables image
  // affinity rather than failing.
  map<string, int64> cached_images = 5 [deprecated = true];
}

// CachedImage is one image a node holds.
message CachedImage {
  // size_bytes is the apparent size of the prepared image file.
  int64 size_bytes = 1;
  // digest is the manifest digest the reference resolved to when it was
  // prepared, or empty for an image with no manifest -- a build's output or a
  // commit of a sandbox's filesystem.
  //
  // Reported because it is the only identity that survives a tag moving, and it
  // is the key a warm snapshot has to be found by: a tag is not enough, since
  // serving a snapshot captured from the image a tag used to name is a silent
  // failure -- the wrong environment restores successfully.
  string digest = 2;
  // warm reports that this node holds a warm snapshot for this image, so a create
  // placed here restores instead of booting a kernel. Measured, that is 0.13 s of
  // host CPU against 0.62 s -- and since throughput is CPU-bound, the difference
  // is a placement decision worth making rather than a detail.
  //
  // A bool on the image rather than a separate list of warm keys, because the
  // node has already resolved the parts the scheduler cannot. A warm snapshot is
  // keyed on (digest, CPU vendor, family, template); a node only ever warms for
  // its own CPU, and a sandbox placed on it runs on that CPU, so the CPU half is
  // satisfied by construction. Reporting the tuple instead would make the
  // scheduler join a ref to a digest to a CPU to answer a question the node has
  // already answered.
  //
  // False is not "cannot be warmed" -- it means "not warm here, now". An image
  // with no digest can never be warm, one that has not been prewarmed is not warm
  // yet, and a node whose bundle was evicted stops reporting it. All three read as
  // false and all three place normally, because a miss boots.
  bool warm = 3;
}

// ImageInventory is the set of images a node holds.
//
// Always the node's complete set, never a delta. A delta protocol would need
// both sides to agree on a base version and to recover when they did not, for a
// message of a few hundred bytes per image; sending the whole set makes a
// dropped report self-correcting.
message ImageInventory {
  map<string, CachedImage> images = 1;
}

message UpdateNodeStatusRequest {
  string node_id = 1;
  string node_token = 2;

  // Each category is optional, and an absent one means "unchanged" rather than
  // "empty". That distinction is why these are messages rather than bare maps:
  // a node reporting only what moved must not be read as a node that has
  // dropped everything else. Getting it wrong in the obvious direction would
  // clear the control plane's view of a node's images every time an unrelated
  // category was reported, which shows up as image affinity that works only
  // sometimes.
  //
  // Adding a category is a new optional field here rather than a new RPC, so
  // this stays the single path for "what this node holds".
  optional ImageInventory images = 3;
}

message UpdateNodeStatusResponse {}

message NodeUsage {
  double cpu_committed = 1;
  int64 memory_committed_mib = 2;
  int64 disk_used_mib = 3;
}

message HeartbeatResponse {
  bool lease_ok = 1;
  string renewed_node_token = 2; // empty = keep current
}

message SyncStateRequest {
  string node_id = 1;
  string node_token = 2;
}

message SyncStateResponse {
  repeated SandboxSpec expected = 1;
}

message SandboxSpec {
  // snapshot_id is set only when restoring. Every sandbox restored from one
  // checkpoint unpacks to the same bytes, so a node caches the unpacked form
  // under this id rather than repeating the work per restore. Empty means
  // "unpack from the stream", which keeps a restore self-contained.
  string snapshot_id = 14;

  // snapshot_chain lists the checkpoints a restore must replay, ordered
  // base-first with snapshot_id last. Empty means snapshot_id is self-contained.
  //
  // The chain is declared here rather than discovered from the stream because the
  // node has to create one reader per layer before reading any of them: each
  // layer is its own gzip stream, and a reader handed the concatenation would
  // stop at the first layer's end. Knowing the count up front also means a
  // restore fails on a chain the node cannot serve instead of part way through
  // assembling one.
  repeated string snapshot_chain = 15;

  string sandbox_id = 1;
  string image = 2;
  double cpu = 3;
  int64 memory_mib = 4;
  int64 disk_mib = 5;
  map<string, string> env = 6;
  repeated string cmd = 7;          // override image CMD; empty = keep image config
  bool auto_start_cmd = 8;
  Lifecycle lifecycle = 9;
  map<string, string> labels = 10;
  string network_policy = 11;
  string runtime = 12;              // internal tier: fc|runc|runsc; empty = node default
  string request_id = 13;
}

message Lifecycle {
  // 0 = unset (never idle out); -0 semantics avoided: use has_idle_timeout.
  bool has_idle_timeout = 1;
  int64 idle_timeout_seconds = 2;
  string on_idle = 3; // pause|delete
}

message SandboxStatus {
  string sandbox_id = 1;
  string state = 2; // PENDING..RUNNING|PAUSED|STOPPED|FAILED
  string reason = 3;
  int64 started_at_unix = 4;
  int64 last_activity_unix = 5;
}

message CreateSandboxRequest {
  SandboxSpec spec = 1;
}

message CreateSandboxResponse {
  SandboxStatus status = 1;
}

message DestroySandboxRequest {
  string sandbox_id = 1;
  bool force = 2;
}

message DestroySandboxResponse {}

message PauseSandboxRequest {
  string sandbox_id = 1;
}

message PauseSandboxResponse {}

message ResumeSandboxRequest {
  string sandbox_id = 1;
}

message ResumeSandboxResponse {}

message GetSandboxRequest {
  string sandbox_id = 1;
}

message GetSandboxResponse {
  SandboxStatus status = 1;
}

message SnapshotSandboxRequest {
  string sandbox_id = 1;
  // include_memory captures guest memory so a restore resumes the running
  // guest. It costs portability: guest memory records what the CPU it booted on
  // offered, and vendor/family cannot be masked away, so such a snapshot only
  // restores on a compatible CPU. Without memory the snapshot is a filesystem
  // and restores anywhere, but the guest boots fresh.
  //
  // Defaulting to false would silently change what existing callers get, so the
  // gateway sends this explicitly and treats absent as true.
  bool include_memory = 2;

  // diff captures only the guest memory written since the sandbox started or was
  // restored. The result is not restorable alone — it is layered onto the chain
  // it descends from — so the caller must record which snapshot it was taken
  // against.
  //
  // The node refuses rather than falling back to a full capture when the guest
  // booted without dirty-page tracking, which cannot be turned on after the
  // fact. A silent fallback would return a bundle costing exactly what the
  // caller was trying to avoid.
  bool diff = 3;
}

message SnapshotChunk {
  bytes data = 1;
}

message RestoreSandboxFrame {
  oneof frame {
    SandboxSpec spec = 1;
    // data carries the bundles back to back, in the order SandboxSpec's
    // snapshot_chain declares. The node splits them at the boundaries the chain
    // implies rather than at markers in the stream, so the sender does not have to
    // know each bundle's size in advance — it is copying from object storage.
    bytes data = 2;
    // layer_end closes the current bundle and moves to the next in the chain. It
    // is a boundary marker rather than a length because the sender learns a
    // bundle's size only by finishing it.
    bool layer_end = 3;
  }
}

message RestoreSandboxResponse {
  SandboxStatus status = 1;
  int64 bytes_restored = 2;
}

message StartUserProcessNodeRequest {
  string sandbox_id = 1;
}

message StartUserProcessNodeResponse {
  int64 pid = 1;
}

message PrewarmImageRequest {
  string image = 1;
}

message PrewarmImageResponse {
  // ready is true once the image can be used without a further pull.
  bool ready = 1;
}

message CommitSandboxRequest {
  string sandbox_id = 1;
  // tag names the resulting image, and must not already exist: images are
  // immutable, so committing over a tag would change what sandboxes already
  // started from it believe about their base.
  string tag = 2;
}

message CommitSandboxResponse {
  string image_ref = 1;
}

message BuildImageRequest {
  string tag = 1;
  // dockerfile is the file's content, carried inline so a caller need not ship
  // a file just to run a few commands.
  string dockerfile = 2;
  // context_tar is the build context for COPY and ADD; empty is valid.
  bytes context_tar = 3;
  map<string, string> build_args = 4;
  int64 size_mib = 5;
}

message BuildImageResponse {
  string image_ref = 1;
  // overlaybd_ref names the published artifact in the shared layer store, so a
  // node that did not build the image can start from it. Empty when the node has
  // no object store configured: the build still succeeds as a node-local .ext4,
  // which is the historical single-node behaviour.
  string overlaybd_ref = 2;
  // size_bytes is the sealed layer's length, which a remote create range-reads
  // against; a wrong value reads past the end.
  int64 size_bytes = 3;
  // layer_digests is the sealed layer chain, base first. A build produces a
  // single base layer today, but the field is a list so a future layered build
  // reports its chain without a proto change.
  repeated string layer_digests = 4;
}

// BuildImageEvent is one frame of a build's progress. Log frames arrive as
// BuildKit produces them; exactly one result frame ends a successful build.
//
// A failure is not a frame: it is the stream's error status, so a caller that
// only checks Recv's error cannot mistake a failed build for a finished one.
message BuildImageEvent {
  oneof event {
    // log is raw BuildKit output, forwarded rather than parsed. BuildKit's
    // progress format is its own and changes between versions; the bytes are
    // what a person reads to find the failing step either way.
    bytes log = 1;
    // result closes a successful build.
    BuildImageResponse result = 2;
  }
}
